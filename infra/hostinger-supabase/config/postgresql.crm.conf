# Conservative baseline for Hostinger KVM 4 (4 vCPU / 16 GB RAM).
# Revisit after collecting pg_stat_statements and production metrics.

shared_buffers = '3GB'
effective_cache_size = '10GB'
maintenance_work_mem = '512MB'
work_mem = '8MB'

checkpoint_completion_target = 0.9
checkpoint_timeout = '15min'
max_wal_size = '4GB'
min_wal_size = '1GB'
wal_compression = on

random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

track_io_timing = on
log_checkpoints = on
log_lock_waits = on
log_temp_files = '64MB'
# Do not emit SQL text or bind values to the journal. Slow-query monitoring is
# based on aggregate pg_stat_statements metrics queried without the query text.
log_min_duration_statement = -1
log_statement = 'none'
log_duration = off
pg_stat_statements.track = 'all'
pg_stat_statements.track_utility = off
deadlock_timeout = '1s'

autovacuum_max_workers = 4
autovacuum_naptime = '30s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
