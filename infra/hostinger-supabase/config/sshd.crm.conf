# CRM Definitivo VPS SSH policy.
# Password access is explicitly enabled for the two allowed administrative
# accounts. Compensating controls are UFW, Fail2ban and key access.
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin yes
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowUsers root hurtz
