services:
  # Docker-published ports can bypass host-level UFW rules. Database access is
  # intentionally available only through docker exec or an explicit SSH tunnel.
  supavisor:
    ports: !reset []

  functions:
    env_file:
      - ./functions.env
    volumes:
      - ./runtime/main/index.ts:/home/deno/functions/main/index.ts:ro,z

  caddy:
    environment:
      EVOLUTION_DOMAIN: ${EVOLUTION_DOMAIN}

  auth:
    environment:
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback

  db:
    volumes:
      - ./volumes/db/99-crm.conf:/etc/postgresql-custom/conf.d/99-crm.conf:ro,z

  evolution-api:
    container_name: crm-evolution-api
    image: ${EVOLUTION_API_IMAGE:-evoapicloud/evolution-api:latest}
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_started
      evolution-redis:
        condition: service_started
    env_file:
      - ./evolution.env
    volumes:
      - ./volumes/evolution/instances:/evolution/instances
    expose:
      - "8080"

  evolution-redis:
    container_name: crm-evolution-redis
    image: ${EVOLUTION_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - ./volumes/evolution/redis:/data
    expose:
      - "6379"

  evolution-postgres:
    container_name: crm-evolution-postgres
    image: ${EVOLUTION_POSTGRES_IMAGE:-postgres:15-alpine}
    restart: unless-stopped
    env_file:
      - ./evolution.env
    command:
      - postgres
      - -c
      - max_connections=500
      - -c
      - listen_addresses=*
    volumes:
      - ./volumes/evolution/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
